version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: creatorflow_postgres
    restart: always
    environment:
      POSTGRES_DB: creatorflow
      POSTGRES_USER: creatorflow
      POSTGRES_PASSWORD: replace_me_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatorflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: creatorflow_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creatorflow_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - SECRET_KEY=prod_super_secret_key_creatorflow_2026
      - DEBUG=false
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - DATABASE_URL=postgresql://creatorflow:replace_me_secure_password@postgres:5432/creatorflow
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - AI_PROVIDER=deterministic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creatorflow_celery
    restart: always
    command: celery -A creatorflow worker --loglevel=info
    environment:
      - APP_ENV=production
      - SECRET_KEY=prod_super_secret_key_creatorflow_2026
      - DATABASE_URL=postgresql://creatorflow:replace_me_secure_password@postgres:5432/creatorflow
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - AI_PROVIDER=deterministic
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creatorflow_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
